<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audigram — listen to everything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f0f; --panel:#212121; --panel-2:#181818; --hover:#2a2a2a;
    --border:#3f3f3f; --text:#f1f1f1; --text-dim:#aaaaaa;
    --red:#ff0000; --blue:#3ea6ff; --green:#3dd598;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Roboto',Arial,sans-serif;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:'Roboto',sans-serif;cursor:pointer;}
  img{-webkit-user-drag:none;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;
    padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border);
  }
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--hover);}
  .brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .logo-mark{width:28px;height:28px;display:flex;align-items:flex-end;justify-content:center;gap:2.5px;}
  .logo-mark .bar{width:4px;background:var(--red);border-radius:2px;animation:pulseBar 1.1s ease-in-out infinite;}
  .logo-mark .bar:nth-child(1){height:11px;animation-delay:0s;}
  .logo-mark .bar:nth-child(2){height:21px;animation-delay:.15s;}
  .logo-mark .bar:nth-child(3){height:28px;animation-delay:.3s;}
  .logo-mark .bar:nth-child(4){height:16px;animation-delay:.45s;}
  @keyframes pulseBar{0%,100%{transform:scaleY(.55);}50%{transform:scaleY(1);}}
  .wordmark{font-weight:700;font-size:18px;}
  .wordmark span{color:var(--red);}

  .searchbar{flex:1;max-width:640px;margin:0 auto;display:flex;}
  .searchbar input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);border-right:none;
    border-radius:20px 0 0 20px;padding:9px 16px;color:var(--text);font-size:14px;
  }
  .searchbar input:focus{outline:none;border-color:var(--blue);}
  .searchbar button{
    width:60px;background:var(--panel);border:1px solid var(--border);border-radius:0 20px 20px 0;color:var(--text-dim);
  }
  .topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .create-btn{
    display:flex;align-items:center;gap:6px;background:var(--panel-2);border:none;border-radius:20px;
    color:var(--text);padding:8px 14px 8px 12px;font-size:13.5px;font-weight:500;
  }
  .create-btn:hover{background:var(--hover);}

  .google-btn{
    display:flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;
    border-radius:20px;padding:8px 16px 8px 12px;font-size:13.5px;font-weight:500;
  }
  .google-btn:hover{box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .avatar-btn{width:32px;height:32px;border-radius:50%;border:none;overflow:hidden;padding:0;}
  .avatar-circle{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;
  }

  /* ---------- LAYOUT ---------- */
  .app-body{display:flex;}
  .sidebar{
    width:240px;flex-shrink:0;padding:12px 8px;position:sticky;top:57px;
    height:calc(100vh - 57px);overflow-y:auto;transition:width .15s ease;
  }
  .sidebar.collapsed{width:72px;}
  .sidebar.collapsed .nav-label{display:none;}
  .nav-item{
    display:flex;align-items:center;gap:22px;padding:10px 14px;border-radius:10px;font-size:13.5px;
    color:var(--text);margin-bottom:1px;
  }
  .nav-item .ic{width:22px;text-align:center;flex-shrink:0;font-size:16px;}
  .nav-item:hover{background:var(--hover);}
  .nav-item.active{background:var(--panel);font-weight:700;}
  .nav-divider{border-top:1px solid var(--border);margin:10px 6px;}
  .nav-heading{font-size:11px;color:var(--text-dim);padding:12px 14px 4px;text-transform:uppercase;letter-spacing:.05em;}

  .main{flex:1;min-width:0;padding:16px 24px 60px;}

  .chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;margin-bottom:6px;}
  .chip{
    flex-shrink:0;background:var(--panel);border:none;border-radius:8px;color:var(--text);
    padding:7px 14px;font-size:13.5px;font-weight:500;
  }
  .chip.active{background:var(--text);color:var(--bg);}
  .chip:not(.active):hover{background:var(--hover);}

  .feed-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px 16px;
  }
  .feed-card{cursor:pointer;}
  .thumb-wrap{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--panel-2);}
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .duration-badge{
    position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;
    padding:2px 5px;border-radius:4px;font-family:'Roboto Mono',monospace;
  }
  .card-meta{display:flex;gap:10px;margin-top:10px;}
  .card-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
  .card-text{min-width:0;}
  .card-title{font-size:14.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-sub{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .card-sub2{font-size:12.5px;color:var(--text-dim);}

  /* ---------- WATCH VIEW ---------- */
  .watch-layout{display:flex;gap:24px;max-width:1400px;}
  .watch-main{flex:1;min-width:0;max-width:900px;}
  .watch-side{width:400px;flex-shrink:0;}
  @media(max-width:1100px){ .watch-layout{flex-direction:column;} .watch-side{width:100%;} }

  .player{
    width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55);}
  .player-controls{position:relative;z-index:2;width:100%;padding:0 16px 12px;align-self:flex-end;}
  .play-toggle{
    width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;
    font-size:22px;display:flex;align-items:center;justify-content:center;position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);z-index:2;
  }
  .seek-row{display:flex;align-items:center;gap:10px;}
  .seek-row input[type=range]{flex:1;accent-color:var(--red);}
  .time-label{font-family:'Roboto Mono',monospace;font-size:11.5px;color:#fff;}

  .watch-title{font-size:19px;font-weight:700;margin:16px 0 10px;line-height:1.3;}
  .watch-stats-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .channel-row{display:flex;align-items:center;gap:12px;}
  .channel-name{font-size:14.5px;font-weight:700;}
  .channel-sub{font-size:12px;color:var(--text-dim);}
  .subscribe-btn{
    background:var(--text);color:var(--bg);border:none;border-radius:20px;padding:9px 18px;font-weight:700;font-size:13.5px;margin-left:14px;
  }
  .subscribe-btn.subscribed{background:var(--panel);color:var(--text);}

  .action-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-group{display:flex;background:var(--panel);border-radius:20px;overflow:hidden;}
  .pill-group button{background:transparent;border:none;color:var(--text);padding:9px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .pill-group button:first-child{border-right:1px solid var(--border);}
  .pill-group button.liked{color:var(--blue);}
  .action-pill{background:var(--panel);border:none;border-radius:20px;color:var(--text);padding:9px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;}
  .action-pill:hover, .pill-group button:hover{background:var(--hover);}

  .desc-box{background:var(--panel);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  .desc-box .genre-tag{color:var(--blue);font-weight:500;}

  .comments-head{font-size:15px;font-weight:700;margin:26px 0 16px;}
  .comment-input-row{display:flex;gap:12px;margin-bottom:22px;}
  .comment-input-row input{
    flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);
    padding:8px 2px;font-size:14px;
  }
  .comment-input-row input:focus{outline:none;border-color:var(--text);}
  .comment{display:flex;gap:12px;margin-bottom:20px;}
  .comment-body{flex:1;min-width:0;}
  .comment-head{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline;}
  .comment-head .t{font-weight:400;color:var(--text-dim);font-size:11.5px;}
  .comment-text{font-size:13.5px;margin-top:3px;line-height:1.5;}
  .comment-actions{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--text-dim);align-items:center;}
  .comment-actions button{background:none;border:none;color:var(--text-dim);display:flex;align-items:center;gap:4px;font-size:12px;}
  .comment-actions button:hover{color:var(--text);}
  .comment-actions button.liked{color:var(--blue);}

  .up-next-title{font-size:15px;font-weight:700;margin-bottom:14px;}
  .up-card{display:flex;gap:8px;margin-bottom:12px;cursor:pointer;}
  .up-thumb{width:168px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;position:relative;background:var(--panel-2);}
  .up-thumb img{width:100%;height:100%;object-fit:cover;}
  .up-duration{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);color:#fff;font-size:10.5px;padding:1px 4px;border-radius:3px;font-family:'Roboto Mono',monospace;}
  .up-text{min-width:0;}
  .up-title{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .up-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#0f0f0f;padding:12px 22px;border-radius:8px;font-size:13.5px;font-weight:500;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .back-btn{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:13.5px;margin-bottom:16px;background:none;border:none;}
  .back-btn:hover{color:var(--text);}

  #viewFeed, #viewWatch{display:none;}
  #viewFeed.show, #viewWatch.show{display:block;}

  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:57px;background:var(--bg);z-index:90;border-right:1px solid var(--border);transform:translateX(-100%);}
    .sidebar.mobile-open{transform:translateX(0);}
    .searchbar{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="btnMenu">☰</button>
  <div class="brand"><div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="wordmark">Audi<span>gram</span></div></div>
  <div class="searchbar"><input type="text" placeholder="Search Audigram" id="searchInput"><button>🔍</button></div>
  <div class="topbar-right">
    <button class="create-btn" id="btnCreate">＋ Create</button>
    <button class="icon-btn">🔔</button>
    <button class="google-btn" id="btnGoogleSignin">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.69-3.87 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.9-2.27c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.34C2.47 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.96H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.04l2.97-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.47 2.02.98 4.96l2.97 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Sign in
    </button>
    <button class="avatar-btn" id="btnAvatar" style="display:none;"><div class="avatar-circle" id="avatarCircle"></div></button>
  </div>
</div>

<div class="app-body">
  <div class="sidebar" id="sidebar">
    <a class="nav-item active" data-nav="home"><span class="ic">⌂</span><span class="nav-label">Home</span></a>
    <a class="nav-item" data-nav="trending"><span class="ic">🔥</span><span class="nav-label">Trending</span></a>
    <a class="nav-item" data-nav="subs"><span class="ic">📻</span><span class="nav-label">Subscriptions</span></a>
    <div class="nav-divider"></div>
    <a class="nav-item" data-nav="library"><span class="ic">🗂</span><span class="nav-label">Library</span></a>
    <a class="nav-item" data-nav="history"><span class="ic">🕘</span><span class="nav-label">History</span></a>
    <div class="nav-divider"></div>
    <div class="nav-heading">Creator</div>
    <a class="nav-item" id="navStudio"><span class="ic">🎙</span><span class="nav-label">Studio (create)</span></a>
    <a class="nav-item"><span class="ic">📊</span><span class="nav-label">Your channel</span></a>
  </div>

  <div class="main">

    <!-- FEED VIEW -->
    <div id="viewFeed" class="show">
      <div class="chips" id="chips"></div>
      <div class="feed-grid" id="feedGrid"></div>
    </div>

    <!-- WATCH VIEW -->
    <div id="viewWatch">
      <button class="back-btn" id="btnBack">← Back to feed</button>
      <div class="watch-layout">
        <div class="watch-main">
          <div class="player" id="player">
            <img id="playerImg" src="" alt="">
            <button class="play-toggle" id="btnPlayToggle">▶</button>
            <div class="player-controls">
              <div class="seek-row">
                <span class="time-label" id="timeCur">0:00</span>
                <input type="range" id="seekBar" min="0" max="100" value="0">
                <span class="time-label" id="timeTotal">0:00</span>
              </div>
            </div>
          </div>

          <div class="watch-title" id="watchTitle"></div>
          <div class="watch-stats-row">
            <div class="channel-row">
              <div class="card-avatar" id="watchAvatar" style="width:44px;height:44px;font-size:15px;"></div>
              <div>
                <div class="channel-name" id="watchChannel"></div>
                <div class="channel-sub" id="watchSubCount"></div>
              </div>
              <button class="subscribe-btn" id="btnSubscribe">Subscribe</button>
            </div>
            <div class="action-pills">
              <div class="pill-group">
                <button id="btnLike">👍 <span id="likeCount"></span></button>
                <button id="btnDislike">👎</button>
              </div>
              <button class="action-pill" id="btnShare">↗ Share</button>
              <button class="action-pill" id="btnSave">＋ Save</button>
            </div>
          </div>

          <div class="desc-box" id="descBox"></div>

          <div class="comments-head" id="commentsHead"></div>
          <div class="comment-input-row">
            <div class="card-avatar" id="commentAvatar" style="width:36px;height:36px;">Y</div>
            <input type="text" id="commentInput" placeholder="Add a comment...">
          </div>
          <div id="commentsList"></div>
        </div>

        <div class="watch-side">
          <div class="up-next-title">Up next</div>
          <div id="upNextList"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const AVATAR_COLORS = ['#ff5e5e','#3ea6ff','#3dd598','#ffb74d','#c084fc','#f472b6','#4dd0e1','#f6c453'];
  const colorFor = seed => AVATAR_COLORS[Math.abs([...seed].reduce((a,c)=>a+c.charCodeAt(0),0)) % AVATAR_COLORS.length];
  const initials = name => name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const fmtTime = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

  function coverUrl(seed, w, h){
    return `https://image.pollinations.ai/prompt/${encodeURIComponent(seed)}?width=${w}&height=${h}&seed=${Math.abs([...seed].reduce((a,c)=>a+c.charCodeAt(0),0))}&nologo=true`;
  }

  // ---------- MOCK CONTENT ----------
  const GENRES = ['All','Folk tale','Horror','Motivational','True crime','Children','Atmospheric'];
  const CREATORS = [
    'Ritu Narrates','Kolkata Kissa','Boler Golpo','Midnight Mic','The Bhalobasha Hour',
    'Anand Speaks','Rooftop Radio Dhaka','Adra Anecdotes','Chai Stall Stories','Teesta Tales'
  ];
  const TITLES = [
    'The radio that still plays Grandfather\'s station',
    'A boatman hears the river singing at dusk',
    'Three nights in an empty Kolkata flat',
    'How I lost my fear of failing (again)',
    'The sweet shop that vanished overnight',
    'A folk tale from the Adra railway colony',
    'What the crows know about your street',
    'The last train out of Siliguri',
    'A grandmother\'s recipe for courage',
    'Voices from a Teesta River monsoon',
    'The letter that arrived 40 years late',
    'Why the market closes early on Tuesdays'
  ];
  const DESCS = [
    'A quiet story recorded for anyone who needs a slow ten minutes today.',
    'Part of an ongoing series recorded across small towns in Eastern India.',
    'Narrated live, one take, no edits — just a voice and a story.'
  ];

  function makeMockFeed(n){
    const items = [];
    for (let i=0;i<n;i++){
      const title = TITLES[i % TITLES.length];
      const creator = CREATORS[i % CREATORS.length];
      const genre = GENRES[1 + (i % (GENRES.length-1))];
      const dur = 120 + Math.floor(Math.random()*480);
      items.push({
        id: 'a'+i,
        title, creator, genre,
        cover: coverUrl(title + ' cinematic cover art warm lighting', 640, 360),
        duration: dur,
        plays: Math.floor(300 + Math.random()*48000),
        uploaded: ['2 days ago','1 week ago','3 weeks ago','1 month ago','5 hours ago','2 months ago'][i % 6],
        desc: DESCS[i % DESCS.length],
        subs: Math.floor(200 + Math.random()*15000),
        likes: Math.floor(20 + Math.random()*900),
        comments: [
          { name: CREATORS[(i+2)%CREATORS.length], text: 'This one stayed with me the whole day.', likes: Math.floor(Math.random()*40), t:'3d ago' },
          { name: CREATORS[(i+5)%CREATORS.length], text: 'Voice and pacing are perfect for this genre.', likes: Math.floor(Math.random()*15), t:'1d ago' }
        ]
      });
    }
    return items;
  }
  const FEED = makeMockFeed(12);

  function fmtPlays(n){ return n > 999 ? (n/1000).toFixed(1)+'K' : n; }

  // ---------- CHIPS ----------
  $('chips').innerHTML = GENRES.map((g,i) => `<button class="chip${i===0?' active':''}" data-g="${g}">${g}</button>`).join('');
  $('chips').addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    $('chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    renderFeed(btn.dataset.g);
  });

  // ---------- FEED RENDER ----------
  function renderFeed(genreFilter){
    const list = (!genreFilter || genreFilter==='All') ? FEED : FEED.filter(f=>f.genre===genreFilter);
    $('feedGrid').innerHTML = list.map(item => `
      <div class="feed-card" data-id="${item.id}">
        <div class="thumb-wrap"><img loading="lazy" src="${item.cover}"><span class="duration-badge">${fmtTime(item.duration)}</span></div>
        <div class="card-meta">
          <div class="card-avatar" style="background:${colorFor(item.creator)}">${initials(item.creator)}</div>
          <div class="card-text">
            <div class="card-title">${item.title}</div>
            <div class="card-sub">${item.creator}</div>
            <div class="card-sub2">${fmtPlays(item.plays)} plays · ${item.uploaded}</div>
          </div>
        </div>
      </div>`).join('');
    $('feedGrid').querySelectorAll('.feed-card').forEach(card => {
      card.addEventListener('click', () => openWatch(card.dataset.id));
    });
  }
  renderFeed('All');

  // ---------- SIDEBAR / NAV ----------
  $('btnMenu').addEventListener('click', () => {
    $('sidebar').classList.toggle('collapsed');
    $('sidebar').classList.toggle('mobile-open');
  });
  document.querySelectorAll('.nav-item[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      el.classList.add('active');
      showToast(el.textContent.trim() + ' — coming in a later build');
      showFeedView();
    });
  });
  $('navStudio').addEventListener('click', () => showToast('Opens the Audigram Studio (audigram.html) — the creation pipeline lives there.'));
  $('btnCreate').addEventListener('click', () => showToast('Opens the Audigram Studio to start a new story.'));

  // ---------- GOOGLE SIGN-IN (UI only — see note in chat) ----------
  let signedIn = false, userName = 'You';
  $('btnGoogleSignin').addEventListener('click', () => {
    signedIn = true;
    $('btnGoogleSignin').style.display = 'none';
    $('btnAvatar').style.display = 'block';
    $('avatarCircle').style.background = colorFor(userName);
    $('avatarCircle').textContent = initials(userName);
    $('commentAvatar').style.background = colorFor(userName);
    $('commentAvatar').textContent = initials(userName);
    showToast('Signed in (UI preview — wire to real Google OAuth on the backend to make this persist)');
  });

  // ---------- TOAST ----------
  let toastTimer;
  function showToast(msg){
    clearTimeout(toastTimer);
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    toastTimer = setTimeout(()=>$('toast').classList.remove('show'), 2600);
  }

  // ---------- WATCH VIEW ----------
  let current = null;
  let playTimer = null, elapsed = 0;

  function showFeedView(){
    $('viewWatch').classList.remove('show');
    $('viewFeed').classList.add('show');
    clearInterval(playTimer);
    window.scrollTo({top:0});
  }
  $('btnBack').addEventListener('click', showFeedView);

  function openWatch(id){
    current = FEED.find(f=>f.id===id);
    if (!current) return;
    clearInterval(playTimer); elapsed = 0;

    $('playerImg').src = current.cover.replace('640','1280').replace('360','720');
    $('btnPlayToggle').textContent = '▶';
    $('seekBar').value = 0;
    $('timeCur').textContent = '0:00';
    $('timeTotal').textContent = fmtTime(current.duration);
    $('seekBar').max = current.duration;

    $('watchTitle').textContent = current.title;
    $('watchAvatar').style.background = colorFor(current.creator);
    $('watchAvatar').textContent = initials(current.creator);
    $('watchChannel').textContent = current.creator;
    $('watchSubCount').textContent = fmtPlays(current.subs) + ' subscribers';
    $('btnSubscribe').classList.remove('subscribed');
    $('btnSubscribe').textContent = 'Subscribe';

    $('likeCount').textContent = fmtPlays(current.likes);
    $('btnLike').classList.remove('liked');
    $('btnDislike').classList.remove('liked');

    $('descBox').innerHTML = `<b>${fmtPlays(current.plays)} plays</b> · ${current.uploaded}<br><br>${current.desc}<br><br><span class="genre-tag">#${current.genre.replace(/\s+/g,'')}</span>`;
    $('commentsHead').textContent = current.comments.length + ' Comments';
    renderComments();
    renderUpNext();

    $('viewFeed').classList.remove('show');
    $('viewWatch').classList.add('show');
    window.scrollTo({top:0});
  }

  function renderComments(){
    $('commentsList').innerHTML = current.comments.map(c => `
      <div class="comment">
        <div class="card-avatar" style="width:36px;height:36px;font-size:12px;background:${colorFor(c.name)}">${initials(c.name)}</div>
        <div class="comment-body">
          <div class="comment-head">${c.name} <span class="t">${c.t}</span></div>
          <div class="comment-text">${c.text}</div>
          <div class="comment-actions"><button class="cm-like">👍 ${c.likes||''}</button><button>👎</button><button>Reply</button></div>
        </div>
      </div>`).join('');
    $('commentsList').querySelectorAll('.cm-like').forEach((btn,i)=>{
      btn.addEventListener('click', () => {
        btn.classList.toggle('liked');
        current.comments[i].likes += btn.classList.contains('liked') ? 1 : -1;
        btn.innerHTML = '👍 ' + (current.comments[i].likes || '');
      });
    });
  }

  $('commentInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && $('commentInput').value.trim()){
      current.comments.unshift({ name: signedIn ? userName : 'You', text: $('commentInput').value.trim(), likes: 0, t:'now' });
      $('commentInput').value = '';
      $('commentsHead').textContent = current.comments.length + ' Comments';
      renderComments();
    }
  });

  function renderUpNext(){
    const others = FEED.filter(f=>f.id!==current.id).slice(0,8);
    $('upNextList').innerHTML = others.map(o => `
      <div class="up-card" data-id="${o.id}">
        <div class="up-thumb"><img loading="lazy" src="${o.cover}"><span class="up-duration">${fmtTime(o.duration)}</span></div>
        <div class="up-text">
          <div class="up-title">${o.title}</div>
          <div class="up-sub">${o.creator}</div>
          <div class="up-sub">${fmtPlays(o.plays)} plays</div>
        </div>
      </div>`).join('');
    $('upNextList').querySelectorAll('.up-card').forEach(card => {
      card.addEventListener('click', () => openWatch(card.dataset.id));
    });
  }

  // simulated playback (mock items have no real audio — see chat note)
  $('btnPlayToggle').addEventListener('click', () => {
    if (playTimer){ clearInterval(playTimer); playTimer=null; $('btnPlayToggle').textContent='▶'; return; }
    $('btnPlayToggle').textContent='❚❚';
    playTimer = setInterval(() => {
      elapsed++;
      if (elapsed >= current.duration){ clearInterval(playTimer); playTimer=null; $('btnPlayToggle').textContent='▶'; elapsed=current.duration; }
      $('seekBar').value = elapsed;
      $('timeCur').textContent = fmtTime(elapsed);
    }, 1000);
  });
  $('seekBar').addEventListener('input', () => { elapsed = parseInt($('seekBar').value); $('timeCur').textContent = fmtTime(elapsed); });

  $('btnLike').addEventListener('click', () => {
    const on = $('btnLike').classList.toggle('liked');
    $('btnDislike').classList.remove('liked');
    current.likes += on ? 1 : -1;
    $('likeCount').textContent = fmtPlays(current.likes);
  });
  $('btnDislike').addEventListener('click', () => {
    $('btnDislike').classList.toggle('liked');
    $('btnLike').classList.remove('liked');
  });
  $('btnSubscribe').addEventListener('click', () => {
    const on = $('btnSubscribe').classList.toggle('subscribed');
    $('btnSubscribe').textContent = on ? 'Subscribed' : 'Subscribe';
    showToast(on ? `Subscribed to ${current.creator}` : `Unsubscribed`);
  });
  $('btnSave').addEventListener('click', () => showToast('Saved to Library'));
  $('btnShare').addEventListener('click', async () => {
    if (navigator.share){
      try { await navigator.share({ title: current.title, text: `Listen to "${current.title}" on Audigram`, url: location.href }); }
      catch(e){}
    } else {
      showToast('Link copied (mock) — real deploy will copy a working URL');
    }
  });

})();
</script>
</body>
</html>
